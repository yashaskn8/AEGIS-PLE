name: Synthetic CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record candidate and interpreter
        run: |
          git rev-parse HEAD
          python3 --version
      - name: Install hash-pinned loopback dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt
      - name: Install hash-pinned static verification tools
        run: |
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-ci.txt
      - name: Validate exact workflow policy
        run: .venv/bin/python -m aegis.workflow_policy
      - name: Lint syntax and undefined-name rules
        run: .venv/bin/ruff check --no-cache --select E9,F63,F7,F82 aegis tests serve.py
      - name: Strict type check typed arithmetic and evidence core
        run: .venv/bin/python -m mypy --strict --no-incremental --cache-dir=/dev/null aegis/aggregation.py aegis/firewall.py aegis/quality_evidence.py aegis/models.py aegis/stream.py aegis/protocol.py
      - name: Run fail-closed synthetic checks
        run: .venv/bin/python -m aegis.ci
      - name: Run bounded synthetic experiment
        run: .venv/bin/python -m aegis.experiment
      - name: Compare dependency verification with full recomputation
        run: .venv/bin/python -m aegis.graph_experiment
      - name: Generate and compare bounded verification policies
        run: .venv/bin/python -m aegis.policy_search
      - name: Compare synthetic document reconciliation ablations
        run: .venv/bin/python -m aegis.document_experiment
      - name: Reproduce learned policy and measure fresh retention
        run: .venv/bin/python -m aegis.learned_policy
      - name: Measure synthetic resources and adaptive routing
        run: .venv/bin/python -m aegis.resource_experiment
      - name: Compare scripted document repair and single attempt
        run: .venv/bin/python -m aegis.document_agent
      - name: Analyze published baseline frontier
        run: .venv/bin/python -m aegis.frontier
      - name: Verify deterministic-first document route
        run: .venv/bin/python -m aegis.deterministic_route
      - name: Analyze published discipline score matrix
        run: .venv/bin/python -m aegis.disciplines
      - name: Check installed dependency consistency
        run: .venv/bin/python -m pip check
      - name: Verify checkout fingerprints and targeted mutation effectiveness
        run: .venv/bin/python -m aegis.quality
      - name: Build and verify extracted educational distribution
        run: .venv/bin/python -m aegis.distribution runs/aegis-educational.zip
      - name: Archive verified educational distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-educational-${{ github.sha }}
          path: runs/aegis-educational.zip
          if-no-files-found: error
          retention-days: 7
