name: Synthetic CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record candidate and interpreter
        run: |
          git rev-parse HEAD
          python3 --version
      - name: Install hash-pinned loopback dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt
      - name: Run fail-closed synthetic checks
        run: .venv/bin/python -m aegis.ci
      - name: Run bounded synthetic experiment
        run: .venv/bin/python -m aegis.experiment
      - name: Compare dependency verification with full recomputation
        run: .venv/bin/python -m aegis.graph_experiment
      - name: Generate and compare bounded verification policies
        run: .venv/bin/python -m aegis.policy_search
